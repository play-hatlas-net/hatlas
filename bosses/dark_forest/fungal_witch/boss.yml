# Fungal Witch: spec (boss pipeline step 1, iteration 2, 2026-11-20). Status: proposed.
# Format: docs/cities-and-dungeons.md §4.1, rules §4.2, phase mechanics §4.5.
# All times in ticks (20 = 1 s). Shares (hp_below, heal, interrupt) are shares of max HP.
# Every animation and sound name is written once here; later steps reuse them exactly.
# Iteration 2 (user): a non-humanoid fungal creature. No face, no hat, no clothes: the cap is the head.
id: fungal_witch
kind: mini_boss
rune: nature
dungeon: dark_forest
name: {en: "Fungal Witch", fr: "Sorcière fongique"}
lore: >
  Nobody planted it. The oldest mushroom of the pale garden pulled its roots out of the rot one wet
  night and stood up on them, taller than the saplings and no thicker. It has no face: it watches
  through slits in its stalk, and its two long arms end in mouths. The forest calls it the witch for
  the pointed sprout on its cap, for the root it plants like a staff, and for the red sap it drinks
  to mend itself. It does not chase intruders. It lets the forest breathe on them.
teaches: >
  Target priority: know what to hit now. The Dark Mushrooms while she is shielded, the witch
  herself while she drinks, and never the side waves.

# Hitbox in blocks (20 x 68 px): legs, stalk and most of the cap. The cap (32 px wide), the arms,
# the staff and the pointed sprout (top at 79 px = 4.9 blocks) reach outside it.
size: {width: 1.25, height: 4.25}
# Extra bones, beside root, body, head, arm_l, arm_r, leg_l, leg_r. `head` is the cap, `body` the lower
# stalk, `chest` the upper stalk with the eye slits. Each arm ends in a maw (maw_* = upper jaw, jaw_* =
# lower jaw that snaps). The left maw clamps the staff. `bulb` is the sap sac she drinks from.
bones: [hip, chest, neck, cap_crown, tendrils_f, tendrils_b, tendrils_l, tendrils_r,
        forearm_l, forearm_r, maw_l, maw_r, jaw_l, jaw_r, shin_l, shin_r, foot_l, foot_r,
        staff, staff_pod, bulb]
stats:
  hp: 600
  armor: 6
  damage_cap_per_hit: 12
  enrage_seconds: 300
  walk_speed: 0.9                          # blocks per second; slow stilt walk, tree_step is her mobility
requires:
  anchors: {tree: {min: 4, max: 8}}        # tree positions set per fight zone (admin setup), used by tree_step
  clearance_blocks: 5.5                    # free height in the fight zone (she is 4.9 blocks tall)

phases:
  - id: p1                                 # "the glade": learn the clouds and the tree steps
    hp_below: 1.0
    moves: [maw_lash, spore_cloud, tree_step]
    idle: idle_calm
    music: fungal_witch_music
  - id: p2                                 # "the brood": protectors, then the sap
    hp_below: 0.7
    enter: phase2_enter                    # she drives the staff into the ground and shakes her cap: spores fall
    enter_ticks: 40
    moves: [maw_lash, spore_cloud, tree_step, call_brood, brew_mend]
    idle: idle_angry
    music: fungal_witch_music
  - id: p3                                 # "the rot": faster, clouds on everyone, side waves
    hp_below: 0.4
    enter: phase3_enter                    # the cap splits wider, every tendril stands out, both maws scream
    enter_ticks: 40
    moves: [maw_lash, spore_cloud, spore_rain, tree_step]
    idle: idle_angry
    speed: 1.25                            # cooldowns and walk speed; wind-ups are NOT shortened
    music: fungal_witch_music
    waves:                                 # optional adds: no XP, no drops, never shield her (§4.5)
      - {mobs: {dark_mushroom: 2, cave_spider: 1}, every_ticks: 300, max_alive: 5, until: boss_death}

moves:
  maw_lash:                                # melee answer to players standing under her
    kind: attack
    windup_ticks: 14                       # the right arm coils back and up behind the cap, its maw gapes, fangs glow
    active_ticks: 4                        # the arm whips forward and down, the maw snaps shut
    recovery_ticks: 20                     # the maw has bitten into the ground and tugs free: punish window
    cooldown_ticks: 40
    shape: {type: cone, range: 4.0, angle: 100}
    damage: 8
    knockback: 0.6
    animation: attack_lash
    sounds: {windup: witch_lash_windup, hit: witch_lash_hit}
    particles: {windup: crit, hit: sweep_attack}

  spore_cloud:                             # her main attack: a poison zone thrown on a player
    kind: attack
    windup_ticks: 20                       # staff lifted and planted, cap tilts back, the pod flares; the spore ring thickens on the ground
    active_ticks: 2
    recovery_ticks: 16
    cooldown_ticks: 70
    shape: {type: circle, radius: 3.0, at: target, range: 18, lock_at_tick: 10}   # position fixed 10 ticks before the hit
    damage: 4                              # the burst when the cloud lands
    zone: {duration_ticks: 100, damage: 2, every_ticks: 20, max_alive: 3}       # 1 heart per second inside; oldest zone removed above 3
    animation: cast_cloud
    sounds: {windup: witch_cloud_windup, hit: witch_cloud_burst, loop: witch_cloud_hiss}
    particles: {windup: spore_blossom_air, ground: falling_spore_blossom, hit: sneeze, zone: spore_blossom_air}

  spore_rain:                              # phase 3: a cloud on several players at once, then a long recovery
    kind: attack
    windup_ticks: 26                       # both arms straight up, maws open to the sky, the cap shakes; a ring under every targeted player
    active_ticks: 4
    recovery_ticks: 30                     # the cap sags forward, arms hang, tendrils limp: the big punish window of phase 3
    cooldown_ticks: 160
    shape: {type: circle, radius: 2.5, at: targets, range: 18, lock_at_tick: 14}
    targets: {base: 2, per_extra_player: 1, max: 5}   # extra = players above 2; one cloud per targeted player
    damage: 4
    zone: {duration_ticks: 80, damage: 2, every_ticks: 20, max_alive: 5}
    animation: cast_rain
    sounds: {windup: witch_rain_windup, hit: witch_rain_burst}
    particles: {windup: spore_blossom_air, ground: falling_spore_blossom, hit: sneeze, zone: spore_blossom_air}

  tree_step:                               # folds into a plain mushroom, sinks, comes out of a tree with a puff of spores
    kind: attack
    windup_ticks: 16                       # legs and arms fold under the cap, the cap drops to the ground like a closing umbrella; the destination tree swirls with spores
    active_ticks: 4                        # the puff around the tree she unfolds from
    recovery_ticks: 24                     # still half folded against the trunk: punish window for whoever read the tree
    cooldown_ticks: 120
    teleport: {anchor: tree, pick: away_from_players, min_distance: 6}
    shape: {type: circle, radius: 2.5, at: destination}
    damage: 5
    knockback: 0.8
    animation: tree_step
    sounds: {windup: witch_step_sink, hit: witch_step_emerge}
    particles: {windup: mycelium, ground: spore_blossom_air, hit: poof}

  call_brood:                              # protectors: she is immune until every Dark Mushroom is dead
    kind: summon
    windup_ticks: 30                       # staff planted, the free maw bites into the soil, the cap shudders; the soil bulges where each one will rise
    recovery_ticks: 10
    minion: dark_mushroom
    count: {base: 3, per_extra_player: 1, max: 8}     # extra = players above 2
    spawn: {around: boss, radius: 5, min_distance_from_players: 2}
    protect: true
    shield:
      animation: spore_shield              # loop: she stands rooted, the tendrils stretch down to the ground like a curtain, spores turn around her
      tether_particles: spore_blossom_air
      immune_sound: witch_shield_hit
      break_animation: stagger             # when the last protector dies
      break_sound: witch_shield_break
      break_stagger_ticks: 40              # punish window
    while_shielded: [spore_cloud, tree_step]          # she keeps attacking from range; the enrage timer keeps running
    uses_per_phase: 1
    animation: summon
    sounds: {windup: witch_summon_cry}
    particles: {windup: mycelium, ground: dust_plume}

  brew_mend:                               # heal channel: she drinks the red sap of her bulb; damage stops it
    kind: heal
    windup_ticks: 16                       # the right maw rises to the bulb under the cap and bites into it; the bulb glows
    channel_ticks: 160                     # the maw gulps, red light pulses down the arm into the stalk
    heal_per_second: 0.02                  # 16 % of max HP when ignored
    interrupt: {damage: 0.08, per_extra_player: 0.02, stagger_ticks: 60, goto_phase: p3}   # the bulb bursts
    cap: phase                             # never above 70 % in p2
    uses_per_phase: 2
    animation: drink_sap
    interrupt_animation: stagger
    sounds: {windup: witch_bulb_bite, loop: witch_gulping, interrupt: witch_bulb_burst}
    particles: {windup: falling_dripstone_lava, loop: heart, interrupt: item_slime}

reactions:                                 # what the players do -> what she does
  - {when: phase_entered, phase: p2, do: call_brood}                 # the summon opens phase 2
  - {when: hp_lost_in_phase, phase: p2, share: 0.12, do: brew_mend}  # each 12 % lost in p2 (max 2 uses)
  - {when: players_far, distance: 12, ticks: 80, do: tree_step}      # ranged parties: she comes to a tree near them
  - {when: hits_taken, count: 6, ticks: 60, do: tree_step}           # melee pressure: she leaves (cooldown still applies)
  - {when: healed_nearby, do: target_healer}                         # next spore_cloud goes on the healer
  - {when: players_grouped, count: 3, radius: 4, do: spore_cloud}    # stacked players get the cloud
defences: []                               # her only defence is the protector shield of call_brood

animations: [spawn, idle_calm, idle_angry, walk, hit, attack_lash, cast_cloud, cast_rain, tree_step,
             summon, spore_shield, drink_sap, stagger, phase2_enter, phase3_enter, death]

sounds:                                    # sounds that do not belong to a move
  spawn: witch_spawn
  idle: witch_idle
  hurt: witch_hurt
  phase2_enter: witch_phase2
  phase3_enter: witch_phase3
  enrage: witch_enrage
  death: witch_death
